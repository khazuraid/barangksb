services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventaris
    volumes:
      - inventaris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventaris"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/inventaris?sslmode=disable
      APP_PORT: "8080"
      SESSION_KEY: ${SESSION_KEY:-dev-only-insecure-key}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      GOOGLE_SA_JSON: ${GOOGLE_SA_JSON:-}
      GOOGLE_DRIVE_PHOTO_FOLDER_ID: ${GOOGLE_DRIVE_PHOTO_FOLDER_ID:-}
      GOOGLE_FOLDER_ID: ${GOOGLE_FOLDER_ID:-}
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: inventaris
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          STAMP=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h db -U postgres inventaris | gzip > /backups/inventaris_$$STAMP.sql.gz
          find /backups -name "inventaris_*.sql.gz" -mtime +30 -delete
          echo "backup done: $$STAMP"
          sleep 86400
        done

volumes:
  inventaris_pgdata:
